<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="meshGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="glowRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="50%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="metalRim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <pattern id="meshPattern" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.2" fill="#475569" opacity="0.6"/>
    </pattern>
  </defs>

  <!-- Background subtle glow -->
  <circle cx="200" cy="200" r="170" fill="#f1f5f9" opacity="0.8"/>
  <ellipse cx="200" cy="335" rx="100" ry="24" fill="#cbd5e1" opacity="0.6" filter="url(#shadow)"/>

  <!-- Speaker Body (Cylinder 360) -->
  <g filter="url(#shadow)">
    <!-- Base -->
    <path d="M130 110 L130 290 A70 25 0 0 0 270 290 L270 110 Z" fill="url(#bodyGrad)"/>
    
    <!-- Mesh pattern overlay -->
    <path d="M130 110 L130 290 A70 25 0 0 0 270 290 L270 110 Z" fill="url(#meshPattern)"/>

    <!-- Top Cap -->
    <ellipse cx="200" cy="110" rx="70" ry="25" fill="url(#metalRim)"/>
    <ellipse cx="200" cy="107" rx="66" ry="22" fill="#0f172a"/>

    <!-- Bottom Metal Ring -->
    <path d="M130 290 A70 25 0 0 0 270 290 L270 300 A70 25 0 0 1 130 300 Z" fill="url(#metalRim)"/>

    <!-- Top Glow Ring -->
    <ellipse cx="200" cy="107" rx="55" ry="18" fill="none" stroke="url(#glowRed)" stroke-width="4" filter="url(#glow)"/>
    <circle cx="200" cy="107" r="14" fill="#020617"/>
    <circle cx="200" cy="107" r="8" fill="#d90429"/>

    <!-- OnlyMusic Brand Emblem on Speaker Body -->
    <rect x="180" y="195" width="40" height="18" rx="3" fill="#ffffff" opacity="0.95"/>
    <text x="200" y="207" font-family="Montserrat, Arial, sans-serif" font-size="8" font-weight="900" fill="#0f172a" text-anchor="middle" letter-spacing="0.5">OM 360</text>

    <!-- Sound Wave Pulses -->
    <path d="M100 180 A120 120 0 0 0 100 240" fill="none" stroke="#ef4444" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
    <path d="M80 165 A150 150 0 0 0 80 255" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 4" opacity="0.5"/>
    
    <path d="M300 180 A120 120 0 0 1 300 240" fill="none" stroke="#ef4444" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
    <path d="M320 165 A150 150 0 0 1 320 255" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 4" opacity="0.5"/>
  </g>
</svg>
