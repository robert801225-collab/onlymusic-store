<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="rgbPulse" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="85%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>
    <linearGradient id="speakerDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadowP" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <circle cx="200" cy="200" r="170" fill="#f8fafc"/>
  <ellipse cx="200" cy="330" rx="90" ry="20" fill="#cbd5e1" opacity="0.6"/>

  <g filter="url(#shadowP)">
    <!-- Portable Loop / Handle -->
    <path d="M170 110 C170 70 230 70 230 110" fill="none" stroke="#ef4444" stroke-width="12" stroke-linecap="round"/>

    <!-- Round Speaker Sphere / Capsule -->
    <rect x="130" y="110" width="140" height="180" rx="70" fill="url(#speakerDark)"/>
    
    <!-- RGB Pulse Center Core -->
    <circle cx="200" cy="200" r="54" fill="url(#rgbPulse)"/>
    <circle cx="200" cy="200" r="42" fill="#0f172a" opacity="0.85"/>
    <circle cx="200" cy="200" r="28" fill="#1e293b"/>

    <!-- Logo on core -->
    <circle cx="200" cy="200" r="14" fill="#38bdf8"/>
    <polygon points="196,192 208,200 196,208" fill="#ffffff"/>

    <!-- Volume and Power Controls -->
    <circle cx="160" cy="275" r="8" fill="#475569"/>
    <circle cx="200" cy="278" r="9" fill="#ef4444"/>
    <circle cx="240" cy="275" r="8" fill="#475569"/>

    <text x="200" y="318" font-family="Montserrat, Arial, sans-serif" font-size="11" font-weight="800" fill="#475569" text-anchor="middle" letter-spacing="1">PULSE MINI</text>
  </g>
</svg>
