<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="woodAlum" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="goldAcc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d4af37"/>
      <stop offset="50%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <filter id="shadowD" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="12" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <circle cx="200" cy="200" r="170" fill="#f8fafc"/>
  <ellipse cx="200" cy="305" rx="140" ry="20" fill="#cbd5e1" opacity="0.6"/>

  <g filter="url(#shadowD)">
    <!-- Base Metal Feet -->
    <rect x="90" y="270" width="40" height="15" rx="3" fill="url(#goldAcc)"/>
    <rect x="270" y="270" width="40" height="15" rx="3" fill="url(#goldAcc)"/>

    <!-- Soundbar Body -->
    <rect x="60" y="170" width="280" height="105" rx="14" fill="url(#woodAlum)"/>
    
    <!-- Acoustic Fabric Grill -->
    <rect x="70" y="180" width="260" height="85" rx="8" fill="#111827"/>

    <!-- Left Speaker Driver -->
    <circle cx="120" cy="222" r="32" fill="#1e293b" stroke="url(#goldAcc)" stroke-width="2"/>
    <circle cx="120" cy="222" r="18" fill="#0f172a"/>
    <circle cx="120" cy="222" r="8" fill="#d4af37"/>

    <!-- Right Speaker Driver -->
    <circle cx="280" cy="222" r="32" fill="#1e293b" stroke="url(#goldAcc)" stroke-width="2"/>
    <circle cx="280" cy="222" r="18" fill="#0f172a"/>
    <circle cx="280" cy="222" r="8" fill="#d4af37"/>

    <!-- Center Status Display & Dial -->
    <rect x="180" y="195" width="40" height="22" rx="4" fill="#030712"/>
    <text x="200" y="210" font-family="Courier New, monospace" font-size="10" font-weight="700" fill="#22c55e" text-anchor="middle">HI-RES</text>

    <!-- Volume Knob -->
    <circle cx="200" cy="242" r="14" fill="url(#goldAcc)"/>
    <circle cx="200" cy="242" r="11" fill="#1e293b"/>
    <line x1="200" y1="233" x2="200" y2="242" stroke="url(#goldAcc)" stroke-width="2"/>
  </g>
</svg>
